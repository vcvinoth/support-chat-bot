spring.application.name=support-chat-bot-backend
server.port=8080

# PDF uploads
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Local ONNX embeddings (all-MiniLM-L6-v2 by default; downloaded and cached on first start)
spring.ai.model.embedding=transformers
spring.ai.embedding.transformer.cache.directory=${user.home}/.cache/spring-ai-models

# Chunking: all-MiniLM-L6-v2 truncates input beyond ~256 word pieces, so keep chunks small
app.rag.chunk-size=200
app.rag.min-chunk-size-chars=100

# Retrieval
app.rag.top-k=5
app.rag.similarity-threshold=0.35

# Claude (API key read from the ANTHROPIC_API_KEY environment variable)
spring.ai.anthropic.chat.model=claude-opus-5
spring.ai.anthropic.chat.max-tokens=16000
